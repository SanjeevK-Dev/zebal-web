<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007373" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<!-- Short, shareable link: zebal.in/app sends people straight to Zebal's page
     on Google Play. A plain meta refresh is used instead of JavaScript so it
     works even with scripts blocked; the button below is the fallback for
     browsers that don't follow it. -->
<meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.sanjeev.spendify">
<meta name="robots" content="noindex">
<title>Get Zebal on Google Play</title>
<meta name="description" content="Zebal — track your expenses by speaking, in any language. Get it on Google Play.">
<meta property="og:title" content="Zebal — Get it on Google Play">
<meta property="og:description" content="Track your expenses by speaking — in any language.">
<meta property="og:image" content="https://zebal.in/og-image.png">
<meta property="og:url" content="https://zebal.in/app">
<link rel="canonical" href="https://play.google.com/store/apps/details?id=com.sanjeev.spendify">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #F6F8FA; --text: #1D1C1D; --text-muted: #616061;
    --primary: #007373; --on-primary: #FFFFFF; --primary-dark: #005C5C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --text: #E3E3E3; --text-muted: #A0A0A0;
      --primary: #4DB6AC; --on-primary: #062525; --primary-dark: #80CBC4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem; line-height: 1.6;
    color: var(--text); background: var(--bg);
  }
  main {
    max-width: 560px; margin: 0 auto; padding: 24px; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  h1 { font-size: 1.6rem; margin: 0 0 12px; line-height: 1.3; }
  p { color: var(--text-muted); margin: 0 0 28px; }
  .cta {
    display: inline-block; background: var(--primary); color: var(--on-primary);
    text-decoration: none; padding: 14px 28px; border-radius: 8px;
    font-weight: 600; min-height: 48px; line-height: 20px;
  }
  .cta:hover { background: var(--primary-dark); }
  .cta:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Taking you to Zebal on Google Play…</h1>
  <p>If nothing happens, use the button below.</p>
  <a class="cta" href="https://play.google.com/store/apps/details?id=com.sanjeev.spendify">Get Zebal on Google Play</a>
</main>
</body>
</html>
