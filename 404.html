<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<title>Page not found — Zebal</title>
<meta name="description" content="This page doesn't exist on the Zebal site.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  :root {
    --bg: #F6F8FA; --surface: #FFFFFF; --text: #1D1C1D;
    --text-muted: #616061; --primary: #0A66C2; --border: #E1E4E8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1E1E1E; --text: #E3E3E3;
      --text-muted: #A0A0A0; --primary: #669DF6; --border: #333333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem; line-height: 1.6;
    color: var(--text); background: var(--bg);
  }
  .container {
    max-width: 560px; margin: 0 auto; padding: 24px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .skip-link {
    position: absolute; left: -9999px;
    background: var(--primary); color: #fff;
    padding: 12px 20px; border-radius: 6px; z-index: 100;
  }
  .skip-link:focus { left: 16px; top: 16px; }
  .logo-mark { display: block; margin: 0 auto 24px; }
  .code { font-size: 1.1rem; font-weight: 700; color: var(--primary); letter-spacing: 1px; margin: 0 0 8px; }
  h1 { font-size: 1.7rem; margin: 0 0 12px; line-height: 1.3; }
  p { color: var(--text-muted); margin: 0 0 32px; }
  a { color: var(--primary); }
  a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .cta {
    display: inline-block;
    background: var(--primary);
    color: #FFFFFF;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: 600;
    min-height: 48px;
    line-height: 20px;
  }
  .cta:hover { background: #084E96; }
  .links { margin-top: 28px; font-size: 0.95rem; }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<div class="container" id="main">
  <svg class="logo-mark" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="logoTitle">
    <title id="logoTitle">Zebal logo</title>
    <rect width="64" height="64" rx="16" fill="var(--primary)"/>
    <text x="26" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
    <rect x="45" y="30" width="3.5" height="10" rx="1.75" fill="#FFFFFF" opacity="0.9"/>
    <rect x="51" y="24" width="3.5" height="22" rx="1.75" fill="#FFFFFF" opacity="0.9"/>
    <rect x="57" y="34" width="3.5" height="6" rx="1.75" fill="#FFFFFF" opacity="0.9"/>
  </svg>

  <p class="code">404</p>
  <h1>This page doesn't exist</h1>
  <p>The link you followed may be broken, or the page may have moved. Let's get you back to somewhere that works.</p>

  <a class="cta" href="/">Go to Zebal home</a>

  <p class="links">
    <a href="/guide/">User Guide</a>
    &nbsp;&middot;&nbsp;
    <a href="mailto:quickconnect82@gmail.com">Report a broken link</a>
  </p>
</div>

</body>
</html>
