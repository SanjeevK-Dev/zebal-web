<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007373" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<title>Page not found — Zebal</title>
<meta name="description" content="This page doesn't exist on the Zebal site.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
  :root {
    --bg: #F6F8FA; --surface: #FFFFFF; --text: #1D1C1D;
    --text-muted: #616061; --primary: #007373; --on-primary: #FFFFFF; --border: #E1E4E8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1E1E1E; --text: #E3E3E3;
      --text-muted: #A0A0A0; --primary: #4DB6AC; --on-primary: #062525; --border: #333333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem; line-height: 1.6;
    color: var(--text); background: var(--bg);
  }
  .container {
    max-width: 560px; margin: 0 auto; padding: 24px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .skip-link {
    position: absolute; left: -9999px;
    background: var(--primary); color: var(--on-primary);
    padding: 12px 20px; border-radius: 6px; z-index: 100;
  }
  .skip-link:focus { left: 16px; top: 16px; }
  .logo-mark { display: block; margin: 0 auto 24px; }
  .code { font-size: 1.1rem; font-weight: 700; color: var(--primary); letter-spacing: 1px; margin: 0 0 8px; }
  h1 { font-size: 1.7rem; margin: 0 0 12px; line-height: 1.3; }
  p { color: var(--text-muted); margin: 0 0 32px; }
  a { color: var(--primary); }
  a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .cta {
    display: inline-block;
    background: var(--primary);
    color: var(--on-primary);
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: 600;
    min-height: 48px;
    line-height: 20px;
  }
  .cta:hover { background: var(--primary-dark, var(--primary)); }
  .links { margin-top: 28px; font-size: 0.95rem; }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<div class="container" id="main">
  <svg class="logo-mark" width="64" height="64" viewBox="0 0 512 512" role="img" aria-labelledby="logoTitle">
      <title id="logoTitle">Zebal logo</title>
      <!-- Same mark as the app's launcher / Play Store icon: a white wallet
           on teal #008080. The teal is fixed (not var(--primary)) so the logo
           looks identical to the app icon in both light and dark mode. -->
      <rect width="512" height="512" rx="128" fill="#008080"/>
      <path transform="translate(114.7 114.7) scale(11.78)" fill="#FFFFFF" d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </svg>

  <p class="code">404</p>
  <h1>This page doesn't exist</h1>
  <p>The link you followed may be broken, or the page may have moved. Let's get you back to somewhere that works.</p>

  <a class="cta" href="/">Go to Zebal home</a>

  <p class="links">
    <a href="/guide/">User Guide</a>
    &nbsp;&middot;&nbsp;
    <a href="mailto:support.sanjeevlabs@gmail.com">Report a broken link</a>
  </p>
</div>

</body>
</html>
